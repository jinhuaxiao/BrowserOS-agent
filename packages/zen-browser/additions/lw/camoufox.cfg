// BrowserOS configuration for Zen Browser

// Allow remote debugging
defaultPref("devtools.debugger.remote-enabled", true);
defaultPref("devtools.debugger.prompt-connection", false);

// Allow pasting in console
defaultPref("devtools.selfxss.count", 100);

// WebRTC intercept IP
defaultPref("media.peerconnection.ice.no_host", true);

// Use bundled fonts
defaultPref("gfx.bundled-fonts.activate", 1);

// Do not truncate pastes
defaultPref("editor.truncate_user_pastes", false);

// Disable telemetry
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);

// Disable updates
defaultPref("app.update.enabled", false);

// Disable safe browsing
defaultPref("browser.safebrowsing.malware.enabled", false);
defaultPref("browser.safebrowsing.phishing.enabled", false);

// UI layout: top address bar (separate nav-bar from tab toolbar)
defaultPref("zen.view.use-single-toolbar", false);

// Fixed address bar instead of floating popup
defaultPref("zen.urlbar.behavior", "normal");

// Show extensions button in toolbar (not hidden)
defaultPref("zen.theme.hide-unified-extensions-button", false);

// Keep extensions in nav-bar instead of overflowing to sidebar
defaultPref("zen.view.overflow-webext-toolbar", false);

// Disable letterboxing (RFP rounds viewport size, causing blank margins on resize)
defaultPref("privacy.resistFingerprinting.letterboxing", false);

// Suppress security sandbox warning notification
defaultPref("security.sandbox.content.level", 0);
defaultPref("dom.ipc.reportProcessHangs", false);

// Allow unsigned/local extension installation
defaultPref("xpinstall.signatures.required", false);
defaultPref("extensions.experiments.enabled", true);
